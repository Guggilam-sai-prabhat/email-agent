name: ci

on:
  push:
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Freeze before installing pip-audit so only the project's own dependencies are
      # audited (not the audit tool's), and skip the editable install, which is not on PyPI.
      - run: pip freeze --exclude-editable > requirements-audit.txt
      - run: pip install pip-audit
      - run: pip-audit --strict -r requirements-audit.txt --no-deps --disable-pip
