name: ci

on:
  push:
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pip install pip-audit
      - run: pip-audit --strict
